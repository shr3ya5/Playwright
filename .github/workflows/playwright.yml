name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Debug blob report
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Blob report folders:"
          find . -type d | grep blob || true

          echo ""
          echo "PNG Files:"
          find . -name "*.png" | wc -l

          echo ""
          echo "JSONL Files:"
          find . -name "*.jsonl"

      - name: Upload blob report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 30

  merge-reports:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Download all blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: all-blob-reports

      - name: List workspace contents
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Workspace files:"
          ls -la

          echo ""
          echo "Directory structure:"
          find . -type d | sort

      - name: Count downloaded screenshots
        run: |
          echo "PNG files before merge:"
          find all-blob-reports -name "*.png" | wc -l

      - name: Verify blob reports
        run: |
          echo "JSONL files:"
          find all-blob-reports -name "*.jsonl"

          echo ""
          echo "PNG files:"
          find all-blob-reports -name "*.png" | head -20

      - name: Merge Playwright Reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Count merged screenshots
        run: |
          echo "PNG files after merge:"
          find playwright-report -name "*.png" | wc -l

      - name: Inspect merged report
        run: |
          echo "Merged report files:"
          find playwright-report -type f | sort | head -200

      - name: Upload merged Playwright Report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30