name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test ./tests/HandsOnUseCases/ --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 30

      - name: Upload Allure Results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: allure-results-${{ matrix.shardIndex }}
          path: allure-results
          retention-days: 30

  merge-reports:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Download all blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download all Allure results
        uses: actions/download-artifact@v5
        with:
          pattern: allure-results-*
          path: all-allure-results
          merge-multiple: true

      - name: Verify merged blob reports
        run: |
          find all-blob-reports -type f

      - name: Verify merged Allure results
        run: |
          find all-allure-results -type f | head -50

      - name: Merge Playwright Reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Check merged Playwright report
        run: |
          echo "===== SCREENSHOT COUNT AFTER MERGE ====="
          find playwright-report -name "*.png" | wc -l

      - name: Generate Allure Report
        run: |
          npx allure generate all-allure-results --clean -o allure-report

      - name: Upload merged Playwright Report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 30

      - name: Upload Allure Report
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report
          retention-days: 30